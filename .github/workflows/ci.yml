name: CLI checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate native release archive and fresh installation
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python scripts/ci_package.py
      - name: Set up Homebrew for native packaging
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          stable: true
      - name: Validate Homebrew source build and fresh bottle installation
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python scripts/ci_homebrew.py --target "$PACKAGE_TARGET"
      - name: Retain tested Homebrew formula and native bottle
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-${{ matrix.target }}
          path: dist-homebrew/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub workflow
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 packaging/homebrew/tap/.github/workflows/ci.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify archive integrity checks and release guards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check guide links and release documentation
        run: python scripts/check_docs.py
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          title = os.environ['PR_TITLE']
          if not re.fullmatch(r'(feat|fix|docs|refactor|test|ci|build|chore|perf|revert)(\([a-z0-9_-]+\))?!?: .+', title):
              raise SystemExit('Use a Conventional Commit title, for example feat(cli): add a command')
          PY

  ci:
    name: CI
    if: always()
    needs: [validate, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every validation job
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$POLICY_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: homebrew-*
          path: ${{ runner.temp }}/homebrew-candidates
      - uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          stable: true
      - name: Compose and audit the complete Homebrew formula
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          import homebrew
          import package
          temporary = Path(os.environ['RUNNER_TEMP'])
          homebrew.compose(temporary / 'homebrew-candidates', temporary / 'homebrew-ci',
                           package.git('rev-parse', 'HEAD'), package.version(), os.environ['GITHUB_RUN_ID'])
          PY
          python scripts/check_homebrew_formula.py --formula "$RUNNER_TEMP/homebrew-ci/tap/Formula/hudson.rb"
