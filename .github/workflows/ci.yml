name: CLI checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        env:
          RUSTUP_HOME: ${{ runner.temp }}/hudson-cli-rustup
        run: rustup show active-toolchain
      - name: Check formatting
        env:
          RUSTUP_HOME: ${{ runner.temp }}/hudson-cli-rustup
        run: cargo fmt --all -- --check
      - name: Check lint warnings
        env:
          RUSTUP_HOME: ${{ runner.temp }}/hudson-cli-rustup
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test commands and API contracts
        env:
          RUSTUP_HOME: ${{ runner.temp }}/hudson-cli-rustup
        run: cargo test --all-targets --locked

  policy:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/ci.yml
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          title = os.environ['PR_TITLE']
          if not re.fullmatch(r'(feat|fix|docs|refactor|test|ci|build|chore|perf|revert)(\([a-z0-9_-]+\))?!?: .+', title):
              raise SystemExit('Use a Conventional Commit title, for example feat(cli): add a command')
          PY

  ci:
    name: CI
    if: always()
    needs: [validate, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$POLICY_RESULT" = success
