name: Prepare Homebrew publication

on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful current-main CLI checks run containing native Homebrew bottles
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == 'hudson-frontier/hudson-cli'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Require qualified current-main source
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
        run: python scripts/release.py verify-run --ci-run "$CI_RUN"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run }}
          pattern: homebrew-*
          path: ${{ runner.temp }}/homebrew-candidates
      - name: Verify and compose the publication bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
        run: python scripts/homebrew.py compose --ci-run "$CI_RUN" --directory "$RUNNER_TEMP/homebrew-candidates" --output "$RUNNER_TEMP/homebrew-ready"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-publication-ready
          path: ${{ runner.temp }}/homebrew-ready/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
